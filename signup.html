<!DOCTYPE html>
<html lang="en">
  <head>
    <script
      src="https://kit.fontawesome.com/6f68c772bb.js"
      crossorigin="anonymous"
      defer
    ></script>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Love Running</title>
    <!--Favicon-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    >
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    >
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    >
    <meta
      name="description"
      content="Love Running. Club for runners in Dublin Ireland. Urban running, trail running. Dublin docklands and Phoenix Park"
    >
    <meta
      name="keywords"
      content="love running running club runners ireland dublin"
    >
    <link rel="stylesheet" href="assets/css/style.css" >
  </head>
  <body>
    <!--Header-->
    <header>
      <a href="index.html"><h1 id="logo">Love Running</h1></a>
      <input type="checkbox" id="nav-toggle" >
      <label for="nav-toggle" class="nav-toggle-label"
        ><i class="fa-solid fa-bars"></i
      ></label>
      <nav>
        <ul id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a class="active" href="signup.html">Signup</a></li>
          <li><a  href="testimonials.html">Testimonials</a></li>
        </ul>
      </nav>
    </header>
    <!-- Main content-->
    <main>
      <section id="signup">
        <form
          id="signup-form"
          action="https://formdump.codeinstitute.net"
          method="post"
        >
          <h2><i class="fa-solid fa-heartbeat"></i>Let's get you signed up!</h2>
          <label for="first-name">First Name</label>
          <input
            class="text-input"
            type="text"
            name="first-name"
            id="first-name"
            required
            
          ><br >
          <label for="last-name">LastName</label>
          <input
            class="text-input"
            type="text"
            name="last-name"
            id="last-name"
            required
            
          ><br >
          <label for="email-address">Email Address</label>
          <input
            class="text-input"
            type="email"
            name="email-address"
            id="email-address"
            required
            
            
          ><br >
          <div class="radio-buttons">
            <label for="road">Road</label>
            <input
              id="road"
              type="radio"
              name="running_preference"
              required
              value="road"
              checked
            ><br >
            <label for="road">Trail</label>
            <input
              id="trail"
              type="radio"
              name="running_preference"
              required
              value="trail"
            ><br >
            <label for="both">Both</label>
            <input
              id="both"
              type="radio"
              name="running_preference"
              required
              value="both"
            >
          </div>
          <input class="join-button" type="submit" value="Let's Run" >
        </form>
      </section>
    </main>
    <!--footer -->
    <footer>
      <ul id="footer-icons">
        <li>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit out Facebook page. (opens in new tab)"
            ><i class="fa-brands fa-facebook"></i
          ></a>
        </li>
        <li>
          <a
            href="https://www.twitter.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Twitter page. (opens in new tab)"
            ><i class="fa-brands fa-x-twitter"></i
          ></a>
        </li>
        <li>
          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page. (opens in new tab)"
            ><i class="fa-brands fa-instagram"></i
          ></a>
        </li>
        <li>
          <a
            href="https://www.youtube.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our YouTube page. (opens in new tab)"
            ><i class="fa-brands fa-youtube"></i
          ></a>
        </li>
      </ul>
    </footer>
  </body>
</html>
